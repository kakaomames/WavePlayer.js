name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Minify WavePlayer.js automatically
        run: |
          npx --yes esbuild main.js --bundle --minify --format=esm --outfile=main.min.js
          npx --yes esbuild WavePlayer.js --minify --format=esm --outfile=WavePlayer.min.js
          ls -lh WavePlayer.js WavePlayer.min.js main.js main.min.js

      - name: Verify package files
        run: |
          node -e "const pkg = require('./package.json'); console.log('Publishing:', pkg.name, pkg.version);"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
